name: AniCompanion
options:
  bundleIdPrefix: com.anicompanion
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: "2.4.0"
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: "1.7.3"
  Highlightr:
    url: https://github.com/raspu/Highlightr
    exactVersion: "2.2.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  AniCompanion:
    type: application
    platform: macOS
    sources:
      # Swift app sources
      - path: AniCompanion
        excludes:
          - "Resources/Animations/**"
          - "Resources/ThreeVRM/**"
          - "Resources/Persona/**"
          # Prebuilt sherpa-onnx dylibs are wired in via `dependencies` below
          # (link + embed); keep the folder scan away from them.
          - "Libraries/**"

      # VRM model resources as a folder reference
      - path: AniCompanion/Resources/VRMModel
        type: folder
        buildPhase: resources

      # Animation clip JSON files as a folder reference
      - path: AniCompanion/Resources/Animations
        type: folder
        buildPhase: resources

      # Three.js + three-vrm HTML/JS scene files
      - path: AniCompanion/Resources/ThreeVRM
        type: folder
        buildPhase: resources

      # Localized character persona (system prompt + proactive prompts) per language
      - path: AniCompanion/Resources/Persona
        type: folder
        buildPhase: resources

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anicompanion.app
        INFOPLIST_FILE: AniCompanion/Info.plist
        CODE_SIGN_ENTITLEMENTS: AniCompanion/AniCompanion.entitlements
        PRODUCT_NAME: AniCompanion
        MARKETING_VERSION: "0.12.2"
        CURRENT_PROJECT_VERSION: 17
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        COMBINE_HIDPI_IMAGES: YES

        # Bridging header exposing the ObjC exception catcher to Swift
        SWIFT_OBJC_BRIDGING_HEADER: AniCompanion/ObjCSupport/AniCompanion-Bridging-Header.h

        # Custom C module (module.modulemap) for the sherpa-onnx C API
        SWIFT_INCLUDE_PATHS: AniCompanion/Libraries/sherpa-onnx
        # The modulemap's `link` autolinks -lsherpa-onnx-c-api (onnxruntime loads
        # transitively via the c-api dylib's own @rpath dependency);
        # point ld at the vendored dylibs
        LIBRARY_SEARCH_PATHS: AniCompanion/Libraries/sherpa-onnx
        # The vendored sherpa-onnx/onnxruntime dylibs are arm64-only; the app targets
        # Apple Silicon (a universal Release build would fail on the x86_64 slice)
        ARCHS: arm64

    entitlements:
      path: AniCompanion/AniCompanion.entitlements

    # System frameworks
    frameworks:
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: WebKit.framework
      - sdk: ScreenCaptureKit.framework

    # sherpa-onnx C API dynamic libraries (embedded; libonnxruntime.dylib is a
    # runtime dependency of libsherpa-onnx-c-api.dylib resolved via @rpath)
    dependencies:
      - framework: AniCompanion/Libraries/sherpa-onnx/libsherpa-onnx-c-api.dylib
        embed: true
      - framework: AniCompanion/Libraries/sherpa-onnx/libonnxruntime.dylib
        embed: true
      - package: MarkdownUI
      - package: SwiftMath
      - package: Highlightr

  AniCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AniCompanionTests
    dependencies:
      - target: AniCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anicompanion.tests
        GENERATE_INFOPLIST_FILE: YES
        # Resolve the vendored sherpa_onnx C module when compiling tests that
        # @testable import the app target
        SWIFT_INCLUDE_PATHS: AniCompanion/Libraries/sherpa-onnx

schemes:
  AniCompanion:
    build:
      targets:
        AniCompanion: all
        AniCompanionTests: [test]
    test:
      targets:
        - AniCompanionTests
